<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>データベース</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">人物データベースシステム</div>
        
        <!-- ナビゲーション -->
        <div class="toolbar">
            <button onclick="showScreen('search-screen')">検索画面</button>
            <button onclick="showScreen('register-screen')">新規登録</button>
        </div>

        <!-- 1. 検索画面 -->
        <div id="search-screen" class="screen">
            <div class="search-box">
                <label>苗字:</label> <input type="text" id="search-lastname">
                <label>性別:</label> 
                <select id="search-gender">
                    <option value="">すべて</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
                <button onclick="searchData()">検索実行</button>
            </div>
            <div class="result-box">
                <table id="result-table">
                    <thead><tr><th>氏名</th><th>性別</th><th>年齢</th><th>詳細</th></tr></thead>
                    <tbody id="result-body">
                        <!-- 検索結果がここに入ります -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. 登録画面 -->
        <div id="register-screen" class="screen" style="display: none;">
            <div class="form-grid">
                <label>苗字:</label> <input type="text" id="reg-lastname">
                <label>名前:</label> <input type="text" id="reg-firstname">
                <label>性別:</label>
                <select id="reg-gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="その他">その他</option>
                </select>
                <label>生年月日:</label> <input type="date" id="reg-birth">
            </div>
            
            <div class="editor-toolbar">
                <button type="button" onclick="insertText('[[', ']]')">リンク [[]]</button>
                <button type="button" onclick="insertText('**', '**')">太字</button>
                <button type="button" onclick="insertText('== ', ' ==')">見出し</button>
            </div>
            <textarea id="reg-details" placeholder="詳細や備考を記入..."></textarea>
            
            <button class="save-btn" onclick="saveData()">登録する</button>
        </div>

        <!-- 3. 詳細表示画面 -->
        <div id="detail-screen" class="screen" style="display: none;">
            <button onclick="showScreen('search-screen')">← 戻る</button>
            <h2 id="view-name">名前</h2>
            <div id="view-basic-info" class="info-box"></div>
            <div id="view-details" class="wiki-content"></div>
        </div>
    </div>

    <!-- Firebaseの読み込み (v9モジュラー版) -->
    <script type="module" src="app.js"></script>
</body>
</html>
